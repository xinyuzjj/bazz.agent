# ============================================================
# BAZZ.AGENT — Windows 便携版自动打包 & Release 发布
#   触发：
#     · push tag v*        （推荐：git tag v1.2.3 && git push origin v1.2.3）
#     · workflow_dispatch  （手动，可填版本号，默认 1.2.3）
#   产物：BAZZ.AGENT-v<版本>-win32-x64-portable.zip → 同名 Release（Latest）
# ============================================================
name: release-portable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.2.3，不带 v）。留空默认 1.2.3"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      BAZZ_STAGE: ${{ github.workspace }}/dist
      BAZZ_PROJ: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 计算版本 / tag / zip 路径
        shell: pwsh
        run: |
          $raw = ""
          if ("${{ github.event_name }}" -eq "push") {
            $raw = "${{ github.ref_name }}"
          } elseif ("${{ inputs.version }}") {
            $raw = "${{ inputs.version }}"
          }
          if ([string]::IsNullOrWhiteSpace($raw)) { $raw = "1.2.3" }
          $v = $raw.TrimStart('v')
          Add-Content -Path $env:GITHUB_ENV -Value "BAZZ_VERSION=$v"
          Add-Content -Path $env:GITHUB_ENV -Value "BAZZ_TAG=v$v"
          Add-Content -Path $env:GITHUB_ENV -Value "BAZZ_ZIP=$env:BAZZ_STAGE/BAZZ.AGENT-v$v-win32-x64-portable.zip"
          Write-Host "BAZZ_VERSION=$v  BAZZ_TAG=v$v"
          Write-Host "BAZZ_ZIP=$env:BAZZ_STAGE/BAZZ.AGENT-v$v-win32-x64-portable.zip"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Python 依赖（requirements-build.txt = 冻结清单，钉死版本）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pyinstaller

      - name: 前端构建（npm ci 含 electron 31.7.7 二进制下载）
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          npm run build
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) { throw "electron dist 缺失" }

      - name: 准备内置 runtime（v1.2.11 起：Node 20 LTS + @binance/agentic-wallet，约 +100MB）
        shell: pwsh
        run: |
          # stamp 已存在时自动跳过；FORCE=1 强制重下。Windows 默认走代理下载（GitHub raw / nodejs.org / npm registry）
          node scripts/prepare-runtime.js
          if (-not (Test-Path "runtime/node/node.exe")) { throw "runtime 准备失败：未生成 runtime/node/node.exe" }
          if (-not (Test-Path "runtime/node_modules/@binance/agentic-wallet/package.json")) { throw "runtime 准备失败：未安装 @binance/agentic-wallet" }
          Write-Host "runtime 就绪："
          Get-ChildItem runtime | Select-Object Name, @{N="MB";E={[math]::Round((Get-ChildItem $_.FullName -Recurse | Measure-Object Length -Sum).Sum/1MB,0)}}

      - name: PyInstaller 冻后端
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean `
            --distpath "$env:BAZZ_STAGE/dist_py" `
            --workpath "$env:BAZZ_STAGE/build_py" `
            ScoutBackend.spec
          if (-not (Test-Path "$env:BAZZ_STAGE/dist_py/ScoutBackend/ScoutBackend.exe")) { throw "ScoutBackend.exe 未生成" }

      - name: 安装 @electron/packager
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock @electron/packager@20.3.0

      - name: 组装桌面便携版并打 zip
        shell: pwsh
        run: |
          node build-desktop.js
          if (-not (Test-Path $env:BAZZ_ZIP)) { throw "便携 zip 未生成: $env:BAZZ_ZIP" }

      - name: 安装 Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 构建 setup.exe 安装包
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe 未找到" }
          & $iscc `
            /DSourceDir="$env:BAZZ_STAGE/dist_desktop/BAZZ.AGENT-win32-x64" `
            /DMyAppVersion="$env:BAZZ_VERSION" `
            /Ddistout="$env:BAZZ_STAGE/dist_desktop" `
            "$env:BAZZ_PROJ/installer.iss"
          $setup = "$env:BAZZ_STAGE/dist_desktop/BAZZ.AGENT-v$env:BAZZ_VERSION-setup.exe"
          if (-not (Test-Path $setup)) { throw "setup.exe 未生成: $setup" }

      - name: 生成 SHA256SUMS 校验和
        shell: pwsh
        run: |
          $zip = $env:BAZZ_ZIP
          $setup = "$env:BAZZ_STAGE/dist_desktop/BAZZ.AGENT-v$env:BAZZ_VERSION-setup.exe"
          $dir = Split-Path $zip -Parent
          $sums = Join-Path $dir "SHA256SUMS"
          if (Test-Path $sums) { Remove-Item $sums -Force }
          Get-FileHash -Algorithm SHA256 -LiteralPath $zip, $setup | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf)
          } | Set-Content -LiteralPath $sums -Encoding ascii
          Write-Host "=== SHA256SUMS ==="
          Get-Content $sums

      - name: 生成 MANIFEST.json 与增量差分包 delta-<ver>.zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 本步骤里 native 命令（gh 等）非零退出属可控场景（如：上一版没有 MANIFEST 资产时
          # gh release download 找不到文件）—— 必须继续，不能按 GitHub Actions 默认把
          # $PSNativeCommandUseErrorActionPreference=$true 当成 terminating 让整个步骤失败。
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = "$env:BAZZ_STAGE/dist_desktop/BAZZ.AGENT-win32-x64"
          $ver  = $env:BAZZ_VERSION
          if (-not (Test-Path $root)) { throw "未找到打包目录: $root" }

          # 1) 当前版全量清单（path 相对 app 根；path -> {s,h}）
          $files = [ordered]@{}
          Get-ChildItem -Path $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length).TrimStart([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
            $rel = $rel -replace '\\','/'
            $files[$rel] = @{ s = [int64]$_.Length; h = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower() }
          }
          $manifest = @{ version = $ver; generated_at = (Get-Date -Format o); files = $files }
          $manifestJson = $manifest | ConvertTo-Json -Depth 6 -Compress
          $outDir = "$env:BAZZ_STAGE/dist_desktop"
          Set-Content -LiteralPath (Join-Path $outDir "MANIFEST.json") -Value $manifestJson -Encoding utf8
          Write-Host "MANIFEST 生成：$($files.Count) 个文件"

          # 2) 拉上一 release 的 MANIFEST.json 作为 diff 基线
          $prevFiles = $null
          $rels = gh release list --repo $env:GITHUB_REPOSITORY --json tagName,createdAt --limit 20 2>$null | ConvertFrom-Json
          $prevRel = $rels | Where-Object { $_.tagName -ne $env:BAZZ_TAG } |
                     Sort-Object { try { [datetime]$_.createdAt } catch { [datetime]::MinValue } } -Descending |
                     Select-Object -First 1
          if ($prevRel) {
            $tmpDir = Join-Path $outDir "_prev_meta"
            New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
            gh release download $prevRel.tagName --pattern "MANIFEST.json" --repo $env:GITHUB_REPOSITORY --dir $tmpDir *> $null
            $prevPath = Join-Path $tmpDir "MANIFEST.json"
            if (Test-Path $prevPath) {
              $prevMan = Get-Content $prevPath -Raw | ConvertFrom-Json
              $prevFiles = $prevMan.files
              Write-Host "diff 基线：$($prevRel.tagName)（$($prevFiles.PSObject.Properties.Count) 文件）"
            }
          }
          if (-not $prevFiles) { Write-Host "无上一版清单 → 跳过差分包（客户端将整包下载）" }

          # 3) 计算相对上一版的变化文件并打差分 zip
          $changed = @()
          foreach ($p in $files.Keys) {
            $prop = $null
            if ($prevFiles) { $prop = $prevFiles.PSObject.Properties[$p] }
            if (-not $prop -or $prop.Value.h -ne $files[$p].h -or $prop.Value.s -ne $files[$p].s) { $changed += $p }
          }
          if ($changed.Count -gt 0 -and $prevFiles) {
            $changedBytes = ($changed | ForEach-Object { [int64]$files[$_].s } | Measure-Object -Sum).Sum
            $totalBytes = (Get-ChildItem -Path $root -Recurse -File | Measure-Object Length -Sum).Sum
            $totalFiles  = $files.Count
            if ($changedBytes -le 120MB -and $changed.Count -le ($totalFiles * 0.6)) {
              $deltaPath = Join-Path $outDir "delta-$ver.zip"
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $dz = [IO.Compression.ZipFile]::Open($deltaPath, 'Create')
              try {
                foreach ($p in $changed) {
                  $full = Join-Path $root ($p -replace '/','\')
                  [byte[]]$buf = [IO.File]::ReadAllBytes($full)
                  $e = $dz.CreateEntry("BAZZ.AGENT-win32-x64/$p", [IO.Compression.CompressionLevel]::Optimal)
                  $es = $e.Open()
                  try { $es.Write($buf, 0, $buf.Length) } finally { $es.Dispose() }
                }
              } finally { $dz.Dispose() }
              Write-Host "差分包生成：$($changed.Count) 文件 / $([math]::Round($changedBytes/1MB,1)) MB → $deltaPath"
            } else {
              Write-Host "变化过大（$($changed.Count) 文件 / $([math]::Round($changedBytes/1MB,1)) MB）→ 跳过差分包，客户端整包下载"
            }
          }

          # 关键：本步骤内最后一条原生命令（gh release download 找不到上一版 MANIFEST 资产时
          # 会返回非零 $LASTEXITCODE）。PowerShell 7 中脚本没有显式 exit 时，进程退出码取
          # 最后原生命令的退出码——哪怕下方逻辑全部走通也会被当成失败。
          # 显式 exit 0，保证「无上一版清单 → 跳过差分包」这类预期场景永远视为成功。
          exit 0

      - name: 发布 / 更新 GitHub Release（介绍 = 当前版本小节）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:BAZZ_TAG
          $zip = $env:BAZZ_ZIP
          $setup = "$env:BAZZ_STAGE/dist_desktop/BAZZ.AGENT-v$env:BAZZ_VERSION-setup.exe"
          $sums = Join-Path (Split-Path $env:BAZZ_ZIP -Parent) "SHA256SUMS"
          $assets = @($zip, $setup, $sums, "$env:BAZZ_STAGE/dist_desktop/MANIFEST.json")
          $delta = "$env:BAZZ_STAGE/dist_desktop/delta-$env:BAZZ_VERSION.zip"
          if (Test-Path $delta) { $assets += $delta }
          # 介绍只放「当前版本」的更新内容：从 RELEASE_NOTES.md 截取 ## 标题含 v<版本> 的小节
          # （到下一个 ## 二级标题为止）；找不到时回退整份文件。历史版本介绍不再堆进 Release。
          $notesFile = $null
          $src = Join-Path $env:GITHUB_WORKSPACE "RELEASE_NOTES.md"
          if (Test-Path $src) {
            $lines = Get-Content $src
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match ('^##\s.*v' + [regex]::Escape($env:BAZZ_VERSION) + '(?![.\d])')) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s') { $end = $i; break }
              }
              $out = Join-Path $env:BAZZ_STAGE "notes-v$env:BAZZ_VERSION.md"
              $lines[$start..($end - 1)] | Set-Content $out -Encoding UTF8
              $notesFile = $out
              Write-Host "介绍截取当前版本小节：RELEASE_NOTES.md 行 $start..$($end - 1) → $out"
            }
          }
          if ($notesFile) {
            Write-Host "使用当前版本小节作为 Release 介绍"
          } else {
            $notesFile = if (Test-Path $src) { $src } else { $null }
            Write-Host "未找到 v$env:BAZZ_VERSION 小节，回退整份 RELEASE_NOTES.md"
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在 → 覆盖上传资产 + 同步介绍"
            foreach ($a in $assets) { gh release upload $tag $a --repo $env:GITHUB_REPOSITORY --clobber }
            if ($LASTEXITCODE -ne 0) { throw "release upload 失败" }
            if ($notesFile) {
              gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notesFile
            }
          } else {
            Write-Host "创建 Release $tag（介绍 = 当前版本更新内容）"
            if ($notesFile) {
              gh release create $tag $assets --repo $env:GITHUB_REPOSITORY `
                --title "BAZZ.AGENT $tag" --notes-file $notesFile
            } else {
              gh release create $tag $assets --repo $env:GITHUB_REPOSITORY `
                --title "BAZZ.AGENT $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { throw "release create 失败" }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY
