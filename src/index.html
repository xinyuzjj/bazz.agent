<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAZZ Agent</title>
<style>
:root{
  --bg:#0a0b0d; --bg2:#111317; --panel:#16191e; --panel2:#1c2026;
  --border:#262b33; --text:#e7e9ee; --dim:#8a93a3; --gold:#f0b90b; --gold2:#ffd34e;
  --green:#2ebd85; --red:#f6465d; --blue:#4a9eff; --warn:#ffb02e;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a2f38;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:264px 1fr 332px;height:100vh;overflow:hidden}
.app.hide-right{grid-template-columns:264px 1fr 0}

/* ---- sidebar ---- */
.side{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#c98f00);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#1a1400}
.brand b{font-size:15px;letter-spacing:.3px}
.brand .sub{font-size:10.5px;color:var(--dim)}
.newchat{margin:4px 12px 10px}
.newchat button{width:100%;padding:10px;border-radius:11px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.newchat button:hover{border-color:var(--gold);color:var(--gold2)}
.conv-list{flex:1;overflow-y:auto;padding:0 8px}
.conv-group{font-size:10.5px;text-transform:uppercase;color:var(--dim);padding:12px 10px 6px;letter-spacing:.12em}
.conv{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--dim);margin-bottom:2px}
.conv:hover{background:var(--panel)}
.conv.active{background:var(--panel2);color:var(--text)}
.conv .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.conv .del{opacity:0;color:var(--dim);font-size:12px;padding:2px 5px;border-radius:6px}
.conv:hover .del{opacity:1}
.conv .del:hover{background:var(--red);color:#fff}
.nav{border-top:1px solid var(--border);padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nav button{background:transparent;border:none;color:var(--dim);padding:9px 4px;border-radius:9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button:hover{background:var(--panel);color:var(--gold2)}

/* ---- chat ---- */
.chat{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chat-hd{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);background:var(--bg2)}
.chat-hd .nm{font-weight:600;font-size:14.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.chat-hd .spacer{flex:1}
.iconbtn{background:var(--panel);border:1px solid var(--border);color:var(--dim);width:34px;height:34px;border-radius:9px;font-size:15px}
.iconbtn:hover{color:var(--gold2);border-color:var(--gold)}

.msgs{flex:1;overflow-y:auto;padding:22px 8% 14px}
.row{display:flex;margin-bottom:18px;gap:12px}
.row.user{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.av.ai{background:linear-gradient(135deg,var(--gold),#b98900);color:#1a1400}
.av.me{background:var(--panel2);border:1px solid var(--border)}
.bubble{max-width:78%;padding:12px 15px;border-radius:14px;line-height:1.62;font-size:14px;white-space:pre-wrap;word-break:break-word}
.row.ai .bubble{background:var(--panel);border:1px solid var(--border);border-top-left-radius:4px}
.row.user .bubble{background:var(--gold);color:#1a1400;border-top-right-radius:4px;font-weight:500}
.bubble h2,.bubble h3{margin:.3em 0}
.bubble table{border-collapse:collapse;width:100%;margin:.5em 0;font-size:13px}
.bubble th,.bubble td{border:1px solid var(--border);padding:5px 8px;text-align:left}
.bubble code{background:#0c0e12;padding:1px 5px;border-radius:5px;color:var(--gold2);font-size:12.5px}
.bubble pre{background:#0c0e12;padding:10px;border-radius:9px;overflow:auto;border:1px solid var(--border)}

/* tool cards */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tool{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--border);
  padding:8px 11px;border-radius:10px;font-size:12.5px;min-width:0}
.tool .ti{font-size:15px}
.tool .tn{font-weight:600}
.tool .td{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.s-ok{border-left:3px solid var(--green)} .s-warn{border-left:3px solid var(--warn)}
.s-info{border-left:3px solid var(--blue)} .s-err{border-left:3px solid var(--red)}

/* approval card */
.approve{margin-top:12px;background:#1a1710;border:1px solid var(--gold);border-radius:11px;padding:13px 15px}
.approve .ah{font-weight:700;color:var(--gold2);margin-bottom:6px;font-size:13.5px}
.approve .ad{color:var(--dim);font-size:12.5px;margin-bottom:10px}
.approve .ab{display:flex;gap:9px}
.approve button{padding:8px 16px;border-radius:9px;border:none;font-weight:600;font-size:13px}
.approve .yes{background:var(--gold);color:#1a1400}
.approve .no{background:var(--panel);border:1px solid var(--border);color:var(--dim)}

/* composer */
.quick{display:flex;gap:7px;flex-wrap:wrap;padding:8px 8% 2px}
.chip{background:var(--panel);border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:20px;font-size:12.5px}
.chip:hover{border-color:var(--gold);color:var(--gold2)}
.composer{display:flex;gap:10px;align-items:flex-end;padding:10px 8% 18px}
.composer textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--border);color:var(--text);
  border-radius:13px;padding:12px 15px;font-size:14px;max-height:140px;line-height:1.5;font-family:inherit}
.composer textarea:focus{outline:none;border-color:var(--gold)}
.send{background:var(--gold);color:#1a1400;border:none;width:46px;height:46px;border-radius:13px;font-size:19px;flex-shrink:0}
.send:hover{background:var(--gold2)}

/* ---- right context ---- */
.ctx{background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;padding:16px 14px;min-width:0}
.app.hide-right .ctx{display:none}
.ctx h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:14px}
.conn{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1d2128}
.conn:last-child{border-bottom:none}
.conn .cl{display:flex;align-items:center;gap:9px;font-size:13px}
.conn .cd{color:var(--dim);font-size:11px}
.pill{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600}
.p-on{background:rgba(46,189,133,.15);color:var(--green)}
.p-off{background:rgba(138,147,163,.15);color:var(--dim)}
.p-warn{background:rgba(255,176,46,.15);color:var(--warn)}
.sig{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px solid #1d2128}
.sig:last-child{border-bottom:none}
.sig .up{color:var(--green)} .sig .dn{color:var(--red)}
.persona{font-size:12.5px;color:var(--dim);line-height:1.55}

/* ---- panel (slide over) ---- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;align-items:flex-end;justify-content:flex-end}
.overlay.open{display:flex}
.panel{width:480px;max-width:92vw;height:100%;background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;animation:slide .18s ease}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.panel-hd{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.panel-hd b{font-size:15px} .panel-hd .x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:20px}
.panel-bd{flex:1;overflow-y:auto;padding:16px 18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600}
.btn-g{background:var(--gold);color:#1a1400} .btn-g:hover{background:var(--gold2)}
.btn-b{background:var(--panel);border:1px solid var(--border);color:var(--text)}
.item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:10px}
.item .top{display:flex;align-items:center;gap:8px}
.item .nm{font-weight:600;font-size:13.5px;flex:1}
.item .ds{color:var(--dim);font-size:12px;margin-top:5px;line-height:1.5}
.switch{position:relative;width:38px;height:21px;background:#2a2f38;border-radius:20px;flex-shrink:0;transition:.2s}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2.5px;left:2.5px;transition:.2s}
.switch.on::after{left:19px}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:20px}
.typing{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:3px;animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- SIDEBAR -->
  <aside class="side">
    <div class="brand">
      <div class="logo">☤</div>
      <div><b>BAZZ</b><div class="sub">Binance Agent OS</div></div>
    </div>
    <div class="newchat"><button id="newChat">＋ 新对话</button></div>
    <div class="conv-list" id="convList"></div>
    <div class="nav">
      <button data-panel="memory">📓<span>记忆</span></button>
      <button data-panel="mcp">🛠️<span>MCP</span></button>
      <button data-panel="cron">⏰<span>定时</span></button>
      <button data-panel="plugins">🔧<span>插件</span></button>
      <button data-panel="settings">⚙️<span>设置</span></button>
      <button data-panel="ctx" id="toggleCtx">📊<span>摘要</span></button>
    </div>
  </aside>

  <!-- CHAT -->
  <section class="chat">
    <div class="chat-hd">
      <span class="dot"></span><span class="nm" id="personaNm">BAZZ ☤</span>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnCtx2" title="切换摘要">📊</button>
    </div>
    <div class="msgs" id="msgs">
      <div class="row ai"><div class="av ai">☤</div><div class="bubble">👋 我是 <b>BAZZ</b>，你的 Binance Agent OS 桌面助手。\n\n试试：<b>扫描</b> · <b>并行扫描</b> · <b>风险</b> · <b>执行交易</b> · <b>支付</b> · <b>链上</b> · <b>定时扫描</b> · <b>记住：我只做现货</b>\n\n在右侧查看实时连接状态，在左下角面板管理模型 / MCP / 定时 / 插件。</div></div>
    </div>
    <div class="quick" id="quick">
      <span class="chip">扫描</span><span class="chip">并行扫描</span><span class="chip">风险</span>
      <span class="chip">执行交易</span><span class="chip">支付</span><span class="chip">链上</span>
      <span class="chip">定时扫描</span><span class="chip">安装 skill</span><span class="chip">帮助</span>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="给 BAZZ 发消息…  (Enter 发送 / Shift+Enter 换行)"></textarea>
      <button class="send" id="send">➤</button>
    </div>
  </section>

  <!-- CONTEXT -->
  <aside class="ctx" id="ctxPanel">
    <h4>连接状态</h4>
    <div class="card" id="connCard"></div>
    <h4>实时信号</h4>
    <div class="card" id="sigCard"><div class="empty">加载中…</div></div>
    <h4>人格</h4>
    <div class="card persona" id="personaCard"></div>
  </aside>
</div>

<!-- PANELS -->
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script>
const $=(s)=>document.querySelector(s);
let curConv=null, streaming=false;

async function api(path,opt={}){const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r;}
async function jget(p){return (await api(p)).json();}
async function jpost(p,b){return (await api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})).json();}

/* ---- conversations ---- */
async function loadConvs(){
  const list=await jget("/api/conversations");
  const el=$("#convList");
  if(!list.length){el.innerHTML='<div class="conv-group">最近</div><div class="empty" style="padding:14px">暂无对话</div>';return;}
  el.innerHTML='<div class="conv-group">最近</div>'+list.map(c=>`<div class="conv ${c.id===curConv?'active':''}" data-id="${c.id}">
    <span class="tt">${esc(c.title||'新对话')}</span><span class="del" data-del="${c.id}">✕</span></div>`).join("");
  el.querySelectorAll(".conv").forEach(d=>d.onclick=()=>openConv(d.dataset.id));
  el.querySelectorAll(".del").forEach(d=>d.onclick=e=>{e.stopPropagation();delConv(d.dataset.del);});
}
async function openConv(id){
  curConv=id;loadConvs();
  const {messages}=await jget("/api/conversations/"+id);
  $("#msgs").innerHTML=messages.map(renderMsg).join("");
  scroll();
}
async function delConv(id){await api("/api/conversations/"+id,{method:"DELETE"});if(curConv===id)curConv=null;$("#msgs").innerHTML="";loadConvs();}

/* ---- render ---- */
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function md(s){return esc(s)
  .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\n/g,"<br>");}
function stClass(s){return {success:"s-ok",warn:"s-warn",info:"s-info",error:"s-err"}[s]||"s-info";}
function toolCard(t){return `<div class="tool ${stClass(t.status)}"><span class="ti">${t.icon||'🔹'}</span>
  <div><div class="tn">${esc(t.name)}</div><div class="td">${esc(t.detail||'')}</div></div></div>`;}
function renderMsg(m){
  let html=`<div class="row ${m.role}"><div class="av ${m.role==='user'?'me':'ai'}">${m.role==='user'?'你':'☤'}</div>
    <div class="bubble">${md(m.content)}`;
  if(m.tools&&m.tools.length)html+=`<div class="tools">${m.tools.map(toolCard).join("")}</div>`;
  if(m.data&&m.data.needs_approval)html+=approveCard(m.data.approval);
  html+=`</div></div>`;
  return html;
}
function approveCard(a){if(!a)return"";
  const d=a.action==="execute_order"?`标的 ${a.signal?.symbol} @ ${a.signal?.price}`:`操作：${a.action}`;
  return `<div class="approve"><div class="ah">⚠️ 需要确认</div><div class="ad">${esc(d)}</div>
    <div class="ab"><button class="yes" data-approve='${esc(JSON.stringify(a))}'>确认执行</button>
    <button class="no">取消</button></div></div>`;}

/* ---- streaming send ---- */
function scroll(){$("#msgs").scrollTop=$("#msgs").scrollHeight;}
async function send(msg,approval=null,signal=null){
  if(streaming)return;msg=(msg||$("#input").value).trim();if(!msg)return;
  streaming=true;$("#input").value="";
  if(!curConv){curConv=await (await api("/api/conversations",{method:"POST"})).json().then(x=>x.id);loadConvs();}
  // user bubble
  $("#msgs").insertAdjacentHTML("beforeend",renderMsg({role:"user",content:msg}));scroll();
  // ai placeholder
  const aiRow=document.createElement("div");aiRow.className="row ai";
  aiRow.innerHTML=`<div class="av ai">☤</div><div class="bubble"><span class="typing"></span><span class="typing"></span><span class="typing"></span></div>`;
  $("#msgs").appendChild(aiRow);scroll();
  const bubble=aiRow.querySelector(".bubble");
  let text="",tools=[],doneEv=null;
  try{
    const r=await fetch("/api/chat/stream",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:msg,conv_id:curConv,approval,signal})});
    const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line)continue;const ev=JSON.parse(line);
        if(ev.type==="meta"){}
        else if(ev.type==="tool"){bubble.insertAdjacentHTML("beforeend",`<div class="tools">${toolCard(ev.tool)}</div>`);scroll();}
        else if(ev.type==="text"){text+=ev.delta;bubble.firstChild&&bubble.firstChild.remove?.();bubble.innerHTML=md(text);scroll();}
        else if(ev.type==="data"){}
        else if(ev.type==="done"){doneEv=ev;}
      }
    }
  }catch(e){bubble.innerHTML="⚠️ 出错了："+esc(e.message);}
  // finalize
  if(doneEv){
    bubble.innerHTML=md(doneEv.reply||text);
    if(doneEv.tools&&doneEv.tools.length)bubble.insertAdjacentHTML("beforeend",`<div class="tools">${doneEv.tools.map(toolCard).join("")}</div>`);
    if(doneEv.needs_approval)bubble.insertAdjacentHTML("beforeend",approveCard(doneEv.approval));
    bindApprove(bubble);
  }
  streaming=false;loadConvs();refreshCtx();
}
function bindApprove(scope){
  (scope||document).querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{
    const a=JSON.parse(b.dataset.approve);
    send("",a,a.action==="execute_order"?a.signal:null);
  });
}

/* ---- context panel ---- */
async function refreshCtx(){
  try{
    const st=await jget("/api/status");
    const m=st.mcp||{};
    const reach=m.reachable?"p-on":"p-warn";
    $("#connCard").innerHTML=`
      <div class="conn"><div class="cl">🛠️ MCP</div><span class="pill ${reach}">${m.reachable?'已连接':'待配置'}</span></div>
      <div class="conn"><div class="cl">💬 模型</div><span class="pill ${st.llm.configured?'p-on':'p-off'}">${st.llm.configured?st.llm.model:'未配置'}</span></div>
      <div class="conn"><div class="cl">💰 x402</div><span class="pill p-warn">演示</span></div>
      <div class="conn"><div class="cl">⛓️ Wallet</div><span class="pill p-off">未连接</span></div>
      <div class="conn"><div class="cl">📈 行情</div><span class="pill p-on">实时</span></div>
      <div class="conn"><div class="cl">⏰ 调度</div><span class="pill p-on">${st.scheduler.detail}</span></div>`;
    $("#personaCard").textContent=st.persona+" · 风险第一 · 确认才下单";
  }catch(e){}
  try{
    const mk=await jget("/api/market");
    const sigs=(mk.signals||[]).slice(0,6);
    $("#sigCard").innerHTML=sigs.length?`<div class="empty" style="padding:0 0 6px">${mk.signals.length} 个异常</div>`+sigs.map(s=>
      `<div class="sig"><span>${s.emoji} ${s.symbol}</span><span class="${s.change_pct>=0?'up':'dn'}">${s.change_pct>=0?'+':''}${s.change_pct.toFixed(2)}%</span></div>`).join("")
      :'<div class="empty">当前无异常波动</div>';
  }catch(e){}
}

/* ---- panels ---- */
const panels={
  settings:()=>`<div class="panel-hd"><b>⚙️ 设置</b><button class="x" onclick="closePanel()">✕</button></div>
    <div class="panel-bd">
      <h4 style="color:var(--dim);font-size:12px;text-transform:uppercase">多模型 LLM</h4>
      <div class="field"><label>Provider</label><select id="provider">
        <option value="openai">OpenAI</option><option value="nous">Nous Portal</option>
        <option value="openrouter">OpenRouter</option><option value="deepseek">DeepSeek</option>
        <option value="custom">自定义</option></select></div>
      <div class="field"><label>Base URL</label><input id="base_url" placeholder="https://api.openai.com/v1"></div>
      <div class="field"><label>Model</label><input id="model" placeholder="gpt-4o-mini"></div>
      <div class="field"><label>API Key</label><input id="api_key" type="password" placeholder="sk-...">
        <div class="hint">仅存本机 SQLite（.scout.db），不跨设备同步。配置后闲聊/分析走真实模型。</div></div>
      <h4 style="color:var(--dim);font-size:12px;text-transform:uppercase;margin-top:18px">Binance（真实下单/读账户）</h4>
      <div class="field"><label>API Key</label><input id="bk" placeholder="Binance API Key"></div>
      <div class="field"><label>API Secret</label><input id="bs" type="password" placeholder="Binance API Secret">
        <div class="hint">需在 Binance App 开启 Agentic 子账户授权。无 Key 时交易为待确认演示。</div></div>
      <button class="btn btn-g" onclick="saveSettings()">保存</button>
    </div>`,
  memory:async()=>{const mem=await jget("/api/memory");
    return `<div class="panel-hd"><b>📓 长期记忆</b><button class="x" onclick="closePanel()">✕</button></div>
    <div class="panel-bd"><div id="memList">${mem.length?mem.map(m=>`<div class="item"><div class="top"><span class="nm">${esc(m.key)}</span>
      <span class="switch" onclick="delMem('${esc(m.key)}')" style="background:var(--red)"></span></div>
      <div class="ds">${esc(m.value)}</div></div>`).join(""):'<div class="empty">还没有记忆。对话中说「记住：…」即可写入。</div>'}</div>
      <div class="field" style="margin-top:14px"><label>新增记忆</label><input id="memKey" placeholder="要点（如：只做现货）">
      <input id="memVal" placeholder="内容" style="margin-top:8px"></div>
      <button class="btn btn-g" onclick="addMem()">添加</button></div>`;},
  mcp:async()=>{const srv=await jget("/api/mcp");
    return `<div class="panel-hd"><b>🛠️ MCP 集成</b><button class="x" onclick="closePanel()">✕</button></div>
    <div class="panel-bd">${srv.map(s=>`<div class="item"><div class="top"><span class="nm">${esc(s.name)}</span>
      <span class="switch ${s.enabled?'on':''}" onclick="toggleMcp('${esc(s.name)}',this)"></span></div>
      <div class="ds">${esc(s.url)}<br><span class="pill ${s.reachable?'p-on':'p-warn'}">${s.reachable?'已连接':'待配置'}</span></div></div>`).join("")}
      <h4 style="color:var(--dim);font-size:12px;text-transform:uppercase;margin-top:8px">添加 Server</h4>
      <div class="field"><input id="mName" placeholder="名称"><input id="mUrl" placeholder="https://.../mcp" style="margin-top:8px">
      <input id="mAuth" placeholder="Auth 环境变量(可选,如 BINANCE_API_KEY)" style="margin-top:8px"></div>
      <button class="btn btn-g" onclick="addMcp()">添加</button></div>`;},
  cron:async()=>{const jobs=await jget("/api/cron");
    return `<div class="panel-hd"><b>⏰ 定时任务</b><button class="x" onclick="closePanel()">✕</button></div>
    <div class="panel-bd">${jobs.length?jobs.map(j=>`<div class="item"><div class="top"><span class="nm">${esc(j.name)}</span>
      <span class="switch ${j.enabled?'on':''}" onclick="toggleCron('${esc(j.id)}',this)"></span></div>
      <div class="ds">${esc(j.schedule)} · 任务 ${esc(j.task)}</div></div>`).join(""):'<div class="empty">暂无定时任务</div>'}
      <h4 style="color:var(--dim);font-size:12px;text-transform:uppercase;margin-top:8px">新增（每日某时）</h4>
      <div class="field"><input id="cName" placeholder="名称" value="每日市场扫描"><input id="cSch" placeholder="0 9 * * * (分 时)" style="margin-top:8px"></div>
      <button class="btn btn-g" onclick="addCron()">添加</button>
      <div class="hint" style="margin-top:10px">到点自动扫描并生成日报，存入「BAZZ 日报」会话。也支持 interval:3600（秒）。</div></div>`;},
  plugins:async()=>{const ps=await jget("/api/plugins");
    return `<div class="panel-hd"><b>🔧 插件 / Skills</b><button class="x" onclick="closePanel()">✕</button></div>
    <div class="panel-bd">${ps.map(p=>`<div class="item"><div class="top"><span class="nm">${esc(p.name||'')}</span>
      <span class="switch ${p.enabled?'on':''}" onclick="togglePlugin('${esc(p.name)}',this)"></span></div>
      <div class="ds">${esc(p.title||'')} — ${esc(p.desc||'')}<br>${p.installed?'<span class="pill p-on">已安装</span>':'<span class="pill p-off">未安装</span>'}</div></div>`).join("")}</div>`;},
  ctx:()=>""
};
async function openPanel(name){
  if(name==="ctx"){$("#app").classList.toggle("hide-right");closePanel();return;}
  let html=typeof panels[name]==="function"?await panels[name]():panels[name];
  $("#panel").innerHTML=html;$("#overlay").classList.add("open");
  if(name==="settings"){const s=await jget("/api/settings");if(s.llm){$("#provider").value=s.llm.provider||"openai";$("#base_url").value=s.llm.base_url||"";$("#model").value=s.llm.model||"";if(s.binance_key_set)$("#bk").value="********";}}
}
function closePanel(){$("#overlay").classList.remove("open");}

/* actions */
async function saveSettings(){
  const llm={provider:$("#provider").value,base_url:$("#base_url").value,model:$("#model").value};
  if($("#api_key").value)$("#api_key").value&&(llm.api_key=$("#api_key").value);
  await jpost("/api/settings",{llm});
  if($("#bk").value&&$("#bk").value!=="********")await jpost("/api/settings",{BINANCE_API_KEY:$("#bk").value});
  if($("#bs").value)await jpost("/api/settings",{BINANCE_API_SECRET:$("#bs").value});
  closePanel();refreshCtx();alert("已保存（仅本机）");
}
async function addMem(){const k=$("#memKey").value.trim(),v=$("#memVal").value.trim();if(!k)return;
  await jpost("/api/memory",{key:k,value:v});openPanel("memory");}
async function delMem(k){await api("/api/memory/"+encodeURIComponent(k),{method:"DELETE"});openPanel("memory");}
async function toggleMcp(n,el){const on=!el.classList.contains("on");el.classList.toggle("on",on);await jpost("/api/mcp/"+n+"/toggle",{enabled:on});refreshCtx();}
async function addMcp(){await jpost("/api/mcp",{name:$("#mName").value.trim(),url:$("#mUrl").value.trim(),auth_env:$("#mAuth").value.trim()});openPanel("mcp");refreshCtx();}
async function toggleCron(id,el){const on=!el.classList.contains("on");el.classList.toggle("on",on);await jpost("/api/cron/"+id+"/toggle",{enabled:on});}
async function addCron(){await jpost("/api/cron",{name:$("#cName").value.trim(),schedule:$("#cSch").value.trim()});openPanel("cron");}
async function togglePlugin(n,el){const on=!el.classList.contains("on");el.classList.toggle("on",on);await jpost("/api/plugins",{name:n,enabled:on});}

/* ---- wire ---- */
$("#newChat").onclick=()=>{curConv=null;$("#msgs").innerHTML="";loadConvs();};
$("#send").onclick=()=>send();
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("#input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,140)+"px";});
$("#quick").querySelectorAll(".chip").forEach(c=>c.onclick=()=>send(c.textContent));
document.querySelectorAll(".nav button[data-panel]").forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
$("#btnCtx2").onclick=()=>$("#app").classList.toggle("hide-right");
$("#toggleCtx").onclick=()=>$("#app").classList.toggle("hide-right");
$("#overlay").onclick=e=>{if(e.target===$("#overlay"))closePanel();};

/* init */
loadConvs();refreshCtx();setInterval(refreshCtx,30000);
</script>
</body>
</html>
